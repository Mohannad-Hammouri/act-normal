<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Act Normal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Lalezar&display=swap">
<style>
/* Layout: a night-time heist. The TV is a lit dollhouse under searchlights; phones are one-thumb controllers. Committed single dark look. */
:root{
  --bg:#120b22; --bg2:#1d1436; --bg3:#2c2050; --ink:#f7f1ff; --muted:#a99cc9;
  --lamp:#ffb547; --lamp2:#ffd28a; --mint:#5fe0b4; --danger:#ff5a6e; --ice:#8fd8ff;
  --line:rgba(255,255,255,.12);
  --display:'Lalezar','Baloo Bhaijaan 2',system-ui,sans-serif;
  --body:'Baloo Bhaijaan 2',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
button:disabled{cursor:default;opacity:.45}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
.logo{font-family:var(--display);letter-spacing:.5px;line-height:1}
.logo b{color:var(--lamp);font-weight:400}
.big-btn{background:var(--lamp);color:#2a1700;font-size:20px;font-weight:800;padding:14px 24px;border-radius:16px;box-shadow:0 6px 0 #b8741d}
.big-btn.alt{background:var(--bg3);color:var(--ink);box-shadow:0 6px 0 #0d0819}
.big-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 #b8741d}
.role-err{background:rgba(255,90,110,.15);border:1px solid var(--danger);padding:10px 14px;border-radius:12px;font-size:15px}
.sw{display:inline-block;vertical-align:middle}

/* ---------- start page: night heist ---------- */
#roleRoot{position:fixed;inset:0;overflow-y:auto;background:linear-gradient(180deg,#07040f 0%,#160d2c 55%,#2a1a4c 100%)}
.night{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 30% 8%,#fff9 50%,transparent 51%),radial-gradient(1.5px 1.5px at 55% 15%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 72% 28%,#fffa 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 10%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 18% 38%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 64% 40%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 92% 44%,#fff7 50%,transparent 51%)}
.moon{position:absolute;top:7%;left:9%;width:78px;height:78px;border-radius:50%;background:#fff4d6;box-shadow:0 0 60px 10px #fff2c455}
.moon::after{content:"";position:absolute;inset:-6px -18px 6px 18px;border-radius:50%;background:#0b0618;opacity:.0}
.beam{position:absolute;bottom:-10%;width:34vmax;height:120vmax;transform-origin:50% 100%;background:linear-gradient(0deg,#ffe9a666,#ffe9a610 70%,transparent);clip-path:polygon(46% 100%,54% 100%,100% 0,0 0);filter:blur(2px)}
.beam.b1{left:4%;animation:sweep1 9s ease-in-out infinite alternate}
.beam.b2{right:2%;animation:sweep2 11s ease-in-out infinite alternate}
@keyframes sweep1{from{transform:rotate(-28deg)}to{transform:rotate(22deg)}}
@keyframes sweep2{from{transform:rotate(26deg)}to{transform:rotate(-24deg)}}
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:30vh;opacity:.9}
.role-box{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:640px;margin:0 auto;
  padding:calc(40px + env(safe-area-inset-top,0px)) 0 calc(40px + env(safe-area-inset-bottom,0px));min-height:100%;justify-content:center}
.role-box .logo{font-size:clamp(64px,14vw,128px);text-shadow:0 6px 0 #0008}
.role-sub{font-size:21px;color:var(--lamp2);font-weight:800;margin-top:-4px}
.role-txt{color:#d6cbef;font-size:16px;line-height:1.7;max-width:44ch;margin:0}
.crowd{width:min(440px,100%);height:auto}
.role-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.role-btns .big-btn{min-width:210px}
.loot{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* ---------- host ---------- */
#hostRoot{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%,#2b1f4e 0%,#110a20 75%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#dark{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(6,4,16,.45),rgba(3,2,10,.88));opacity:0;transition:opacity .8s;pointer-events:none}
#dark.on{opacity:1}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.lb.room{font-size:clamp(11px,1.05vw,15px);font-weight:700;color:#2b1f45;background:rgba(255,255,255,.7);padding:0 10px;border-radius:99px}
.lb.num{font-family:var(--display);font-size:clamp(20px,2.1vw,32px);line-height:1;min-width:1.6em;text-align:center;padding:4px 6px 0;border-radius:12px;background:#fff;color:#1d1436;border:3px solid var(--c,#fff);box-shadow:0 4px 0 #0006}
.lb.name{font-size:clamp(14px,1.35vw,20px);font-weight:800;color:#fff;background:var(--bg3);border:3px solid var(--c,var(--lamp));padding:1px 12px;border-radius:12px;animation:pop .35s}
.lb.name small{font-weight:700;opacity:.85;margin-inline-start:6px}
.lb.name.hold{background:var(--danger);border-color:#fff}
.lb.name.out{opacity:.35}
.lb.ok{border-color:var(--mint)}.lb.bad{border-color:var(--danger)}
.lb.rank{font-size:clamp(16px,1.5vw,22px)}
.lb.win{font-family:var(--display);font-size:clamp(34px,4vw,64px);font-weight:400;padding:6px 26px 0;background:var(--lamp);color:#2a1700;border-color:#fff}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-left,0px)) 0;pointer-events:none}
.pill{font-size:clamp(18px,1.6vw,24px);font-weight:800;background:rgba(18,11,34,.82);padding:6px 18px;border-radius:14px;border:1px solid var(--line)}
.pill small{display:block;font-size:.62em;font-weight:600;color:var(--muted)}
.timer{font-family:var(--display);font-size:clamp(36px,4vw,60px);line-height:1;background:rgba(18,11,34,.82);padding:8px 18px 2px;border-radius:16px;font-variant-numeric:tabular-nums;min-width:2.6em;text-align:center;border:1px solid var(--line)}
.timer.hot{color:var(--danger)}
#tip{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:clamp(17px,1.6vw,24px);font-weight:800;background:rgba(18,11,34,.85);padding:6px 20px;border-radius:14px;border:2px solid var(--lamp);white-space:nowrap;pointer-events:none;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
#rec{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:max(20px,env(safe-area-inset-left,0px));font-family:ui-monospace,monospace;font-size:clamp(18px,1.7vw,26px);font-weight:700;color:#fff;background:#000a;padding:4px 14px;border-radius:8px;pointer-events:none}
#rec i{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:#ff3b55;margin-inline-end:8px;vertical-align:middle;animation:blink 1s infinite}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#0002 3px 4px);box-shadow:inset 0 0 120px #000a}
@keyframes blink{50%{opacity:.25}}
#banner{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:all .25s;pointer-events:none;
  font-family:var(--display);font-size:clamp(28px,3.6vw,56px);text-align:center;padding:10px 28px 4px;border-radius:20px;background:var(--bg2);border:3px solid var(--lamp);white-space:nowrap;max-width:94vw}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner.red{border-color:var(--danger)}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:24px;overflow:auto}
.ov.dim{background:rgba(8,5,18,.55)}
.card{background:rgba(26,18,46,.94);border:1px solid var(--line);border-radius:26px;padding:28px 32px;width:min(900px,100%);box-shadow:0 30px 80px #0009}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
/* lobby */
.lob{display:grid;grid-template-columns:1fr 1.1fr;gap:30px;align-items:center}
@media (max-width:760px){.lob{grid-template-columns:1fr}}
.lob .logo{font-size:clamp(54px,6.5vw,96px)}
.tag{color:var(--lamp2);font-weight:800;font-size:19px;margin:6px 0 16px}
.join{display:flex;gap:16px;align-items:center;background:var(--bg3);border-radius:18px;padding:14px}
.join .qr{background:#fff;border-radius:12px;padding:8px;width:132px;height:132px;flex:none}
.join .qr svg{width:100%;height:100%;display:block}
.join p{margin:0;color:var(--muted);line-height:1.6}
.code{font-family:var(--display);font-size:52px;color:var(--lamp);letter-spacing:8px;line-height:1.1;display:block}
.sec-t{font-size:14px;color:var(--muted);font-weight:700;margin:0 0 8px}
.plist{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;margin-bottom:18px}
.pl{display:flex;align-items:center;gap:6px;background:var(--bg3);padding:3px 14px 3px 6px;border-radius:99px;font-weight:700}
.pl .sw{width:30px;height:30px}
.empty{color:var(--muted);font-size:15px}
.segs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.segb{display:flex;align-items:center;gap:8px;background:var(--bg3);padding:8px 12px;border-radius:12px;font-weight:700;font-size:16px;text-align:start;border:2px solid transparent}
.segb.on{border-color:var(--lamp);background:#3b2a20}
.segb span{font-size:24px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.chip-btn{background:var(--bg3);padding:6px 14px;border-radius:10px;font-weight:800;font-size:16px}
/* intro */
.intro{text-align:center;max-width:720px}
.intro .em{font-size:84px;line-height:1}
.intro h2{font-family:var(--display);font-size:clamp(46px,5vw,78px);margin:8px 0 4px}
.intro ol{text-align:start;color:#ddd3f5;font-size:clamp(17px,1.5vw,21px);line-height:1.8;margin:12px auto;max-width:36em;padding-inline-start:24px}
.intro .cd{font-family:var(--display);font-size:46px;color:var(--lamp)}
.step{display:inline-block;background:var(--bg3);border-radius:99px;padding:2px 14px;color:var(--muted);font-weight:700;font-size:14px}
/* question */
#qbox{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(980px,94vw);pointer-events:none}
.qcard{background:rgba(18,11,34,.92);border:2px solid var(--lamp);border-radius:22px;padding:16px 22px;text-align:center;animation:rise .3s}
.qcard h3{font-size:clamp(22px,2.2vw,34px);font-weight:800;margin-bottom:10px}
.qopts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qo{background:var(--bg3);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:clamp(15px,1.3vw,19px);border:3px solid transparent;transition:all .3s}
.qo .sw{width:58px;height:58px}
.qo.good{border-color:var(--mint);background:#123d33}
.qo.dim{opacity:.35}
.qo small{color:var(--mint);font-size:.8em}
/* results / board */
.res-t{font-family:var(--display);font-size:clamp(34px,3.6vw,54px);margin-bottom:4px;text-align:center}
.res-sub{color:var(--muted);margin-bottom:16px;text-align:center}
.rows{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--bg3);border-radius:16px;padding:8px 16px 8px 10px;animation:rise .4s both}
.rrow .sw{width:44px;height:44px}
.rrow b{font-size:clamp(18px,1.6vw,24px)}
.rrow .st{display:block;color:var(--muted);font-size:clamp(13px,1.1vw,16px);font-weight:600}
.rrow .pts{font-family:var(--display);font-size:clamp(28px,2.6vw,40px);color:var(--mint);font-variant-numeric:tabular-nums}
.rrow .pts.neg{color:var(--danger)}
.board{position:relative}
.board .rrow{position:absolute;left:0;right:0;transition:top .8s cubic-bezier(.5,1.4,.5,1);animation:none}
.board .rk{font-family:var(--display);font-size:30px;color:var(--lamp);width:1.4em;text-align:center}
.board .delta{font-family:var(--display);font-size:24px;color:var(--mint);margin-inline-end:10px;opacity:0;transition:opacity .3s}
.board .delta.show{opacity:1}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.foot .nx{color:var(--muted);font-weight:700}
.podium{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.pod{display:flex;justify-content:space-between;align-items:center;background:var(--bg3);border-radius:14px;padding:6px 16px;font-size:clamp(17px,1.5vw,22px);font-weight:800}
.pod:first-child{background:var(--lamp);color:#2a1700;font-size:clamp(22px,2vw,30px)}
.pod .sw{width:36px;height:36px;margin-inline-end:8px}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cf{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.skip{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));inset-inline-end:max(14px,env(safe-area-inset-right,0px));background:rgba(18,11,34,.7);font-size:13px;padding:4px 10px;border-radius:8px;color:var(--muted)}

/* ---------- phone ---------- */
#phoneRoot{position:fixed;inset:0;overflow-y:auto;padding:calc(42px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,var(--bg2),var(--bg) 45%);display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;-webkit-user-select:none;user-select:none;transition:background .3s}
#phoneRoot.hot{background:linear-gradient(180deg,#7a1024,#3a0612)}
.p-center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:12px 0}
.p-center h2{font-family:var(--display);font-size:42px;line-height:1.1}
.p-center p{color:var(--muted);margin:0;line-height:1.7;max-width:34ch}
.p-center .em{font-size:72px;line-height:1}
.p-in{width:100%;font:inherit;font-size:22px;font-weight:700;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.ph-top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.me{display:flex;align-items:center;gap:8px;font-weight:800;background:var(--bg3);padding:3px 14px 3px 4px;border-radius:99px}
.me .sw{width:34px;height:34px}
.stat{font-weight:800;background:var(--bg3);padding:4px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
.stat.t{font-family:var(--display);font-size:22px;font-weight:400;padding:2px 12px 0}
.mapwrap{background:#120b20;border-radius:16px;border:1px solid var(--line);padding:4px}
.pmap{width:100%;display:block;touch-action:none}
.nearc{display:flex;align-items:center;gap:12px;background:var(--bg3);border-radius:16px;padding:10px 14px;min-height:76px}
.nearc .e{font-size:46px;line-height:1}
.nearc b{font-size:20px;display:block}
.nearc span{color:var(--muted);font-weight:700}
.nearc .v{margin-inline-start:auto;font-family:var(--display);font-size:34px;color:var(--lamp)}
.bigact{position:relative;overflow:hidden;font-size:30px;font-weight:800;padding:26px 10px;border-radius:22px;background:var(--mint);color:#062a1e;box-shadow:0 7px 0 #2a9a74;width:100%}
.bigact .fill{position:absolute;inset:0 auto 0 0;background:#0003;width:0}
.bigact:active:not(:disabled){transform:translateY(4px);box-shadow:0 3px 0 #2a9a74}
.bigact.red{background:var(--danger);color:#fff;box-shadow:0 7px 0 #a3283a}
.vroom{background:var(--bg2);border-radius:14px;padding:8px}
.vroom h4{margin:0 0 6px;font-size:14px;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vb{background:var(--bg3);border-radius:12px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;border:3px solid transparent}
.vb .sw{width:40px;height:40px}
.vb b{font-family:var(--display);font-size:24px;font-weight:400;line-height:1}
.vb.on{border-color:var(--lamp);background:#4a3418}
.vb.me{opacity:.35}
.qbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qb{background:var(--bg3);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:18px;border:3px solid transparent;min-height:110px;justify-content:center}
.qb .sw{width:64px;height:64px}
.qb.on{border-color:var(--lamp)}
.dots{letter-spacing:4px;font-size:22px}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tb{display:flex;align-items:center;gap:8px;background:#fff;color:#2a0a12;border-radius:16px;padding:12px;font-size:20px;font-weight:800}
.tb .sw{width:40px;height:40px}
.holdbar{height:12px;border-radius:99px;background:#0005;overflow:hidden}
.holdbar i{display:block;height:100%;background:#fff;width:0}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--mint);color:#062a1e;font-weight:800;padding:8px 18px;border-radius:12px;z-index:20;animation:pop .3s;white-space:nowrap}
.exit{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));inset-inline-end:max(8px,env(safe-area-inset-right,0px));background:transparent;color:var(--muted);font-size:20px;padding:4px 10px;z-index:5}
.okbig{font-family:var(--display);font-size:80px;line-height:1}
.okbig.g{color:var(--mint)}.okbig.r{color:var(--danger)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="roleRoot">
  <div class="night" aria-hidden="true"><div class="stars"></div><div class="moon"></div><div class="beam b1"></div><div class="beam b2"></div><svg class="skyline" id="skyline" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMax slice"></svg></div>
  <div class="role-box">
    <svg class="crowd" viewBox="0 0 440 130" aria-hidden="true" id="crowdSvg"></svg>
    <h1 class="logo">Act <b>Normal</b></h1>
    <div class="role-sub">تصرّف طبيعي… وإنت بتسرق <span class="loot">💰</span></div>
    <p class="role-txt">سهرة ألعاب بأربع فقرات بنفس البيت. افتح الرابط على الشاشة الكبيرة، وكل لاعب يفتحه على تلفونه.</p>
    <div class="role-btns">
      <button class="big-btn" id="asHost">📺 الشاشة الكبيرة</button>
      <button class="big-btn alt" id="asPlayer">📱 تلفون (لاعب)</button>
    </div>
    <div id="roleMsg"></div>
  </div>
</div>

<div id="hostRoot" hidden>
  <canvas id="gl"></canvas>
  <div id="dark"></div>
  <div id="scan" hidden></div>
  <div id="labels"></div>
  <div id="hud" hidden><div class="pill" id="hudL"></div><div class="timer" id="hudT"></div></div>
  <div id="rec" hidden></div>
  <div id="tip" hidden></div>
  <div id="qbox" hidden></div>
  <div id="banner"></div>
  <div id="ov" class="ov" hidden></div>
  <div id="fx"></div>
  <button class="skip" id="skipBtn" hidden>تخطّي ⏭</button>
</div>

<div id="phoneRoot" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

function localRoom(){ // same-browser fallback (tabs) — used when the Claude room is unavailable
  let bc;try{bc=new BroadcastChannel('act-normal')}catch(e){return null}
  const me=Math.random().toString(36).slice(2,12);let my={};const others=new Map();const hs=[];let snap=Object.freeze([]);let pend=false;
  function emit(){const now=Date.now();for(const[k,v]of others)if(now-v.last>4000)others.delete(k);
    snap=Object.freeze([{peer:me,isMe:true,sameTab:true,kind:'viewer',presence:my},...[...others].map(([k,v])=>({peer:k,isMe:false,sameTab:false,kind:'viewer',presence:v.p}))]);
    hs.forEach(f=>{try{f({peers:snap})}catch(e){console.error(e)}})}
  const sched=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;emit()},20)};
  const send=()=>bc.postMessage({t:'p',peer:me,p:my});
  bc.onmessage=e=>{const d=e.data;if(!d)return;if(d.t==='p'){others.set(d.peer,{p:d.p,last:Date.now()});sched()}else if(d.t==='bye'){others.delete(d.peer);sched()}else if(d.t==='hi')send()};
  setInterval(()=>{send();emit()},1000);addEventListener('pagehide',()=>bc.postMessage({t:'bye',peer:me}));bc.postMessage({t:'hi'});
  return{local:true,presence(patch){my=Object.assign({},my);for(const k in patch){if(patch[k]===null)delete my[k];else my[k]=patch[k]}send();sched();return Promise.resolve()},
    onPeers(f){hs.push(f);setTimeout(emit,0);return()=>{}},peers:()=>snap}}

    const peer=new Peer(PEER_PREFIX+code.toLowerCase());const conns=new Map();let my={},snap=makeSnap([]),hs=[],sendT=null;
    const emit=()=>{snap=makeSnap([{peer:'host',isMe:true,sameTab:true,kind:'viewer',presence:my},...[...conns].map(([k,v])=>({peer:k,isMe:false,sameTab:false,kind:'viewer',presence:v.p}))]);hs.forEach(f=>{try{f({peers:snap})}catch(e){console.error(e)}})};
    const flush=()=>{sendT=null;conns.forEach(e=>{try{if(e.c.open)e.c.send({t:'p',p:my})}catch(err){}})};
    peer.on('open',()=>resolve({code,presence(patch){my=Object.assign({},my);for(const k in patch){if(patch[k]===null)delete my[k];else my[k]=patch[k]}if(!sendT)sendT=setTimeout(flush,30);emit();return Promise.resolve()},
      onPeers(f){hs.push(f);setTimeout(emit,0);return()=>{}},peers:()=>snap}));

    if(k==='spect'){root.innerHTML='<div class="p-center"><div class="em">👀</div><p>اللعبة شغالة هلأ. تابع على الشاشة، ورح تدخل باللعبة الجاية.</p></div>';return}
    if(k==='lobby'){root.innerHTML=`<div class="p-center"><div class="em">🕵️</div><h2>إنت جوّا</h2><p>أهلين <b>${esc(name)}</b>. لما تبلّش السهرة، كل فقرة بتشرحلك حالها هون.</p><p>🤫 خبّي تلفونك عن اللي جنبك.</p></div>`;return}
    if(k==='intro'){const S=SEGS[HS.seg];root.innerHTML=`<div class="p-center"><span class="stat">الفقرة ${HS.si+1} من ${HS.sn}</span><div class="em">${S.e}</div><h2>${S.t}</h2><p style="text-align:start">${S.rules.map(r=>'• '+r).join('<br>')}</p></div>`;return}
    if(k.startsWith('st_play')){root.innerHTML=`<div class="ph-top"><span class="me">${lookSvg(m.lk)}إنت ${esc(lookName(m.lk))}</span><span class="stat" id="sN"></span><span class="stat t" id="tm"></span></div>
        <div class="mapwrap"><canvas class="pmap" id="mp"></canvas></div><div class="nearc" id="nc"></div>
        <button class="bigact" id="sb"><span class="fill" id="sf"></span><span id="sl">🫳 اسرق</span></button>
        <p style="margin:0;text-align:center;color:var(--muted);font-size:14px">في كمان اثنين بنفس شكلك. النقطة اللي بتلمع هي إنت.</p>`;
      $('#sb').onclick=()=>{send({sr:nx()})};return}
    if(k.startsWith('st_vote')){if(vkey!==HS.vk){vkey=HS.vk;vsel=[]}
      const byR={};HS.vo.forEach(v=>{(byR[v[2]]=byR[v[2]]||[]).push(v)});
      root.innerHTML=`<div class="ph-top"><b style="font-size:20px">🗳️ مين الحرامية؟</b><span class="stat t" id="tm"></span></div><p style="margin:0;color:var(--muted)">اختار لحد 3 أرقام من الشاشة. الصح <b style="color:var(--mint)">+2</b>، والغلط <b style="color:var(--danger)">−1</b>.</p>
        ${Object.keys(byR).map(r=>`<div class="vroom"><h4>${ROOMS[r].n}</h4><div class="vgrid">${byR[r].map(v=>`<button class="vb ${v[0]===m.num?'me':''}" data-n="${v[0]}" ${v[0]===m.num?'disabled':''}>${lookSvg(v[1])}<b>${v[0]}</b>${v[0]===m.num?'<small>إنت</small>':''}</button>`).join('')}</div></div>`).join('')}
        <button class="big-btn" id="vd" style="width:100%"></button>`;
      const sync=d=>{send({vt:{k:vkey,s:vsel,d:d?1:0}});root.querySelectorAll('.vb').forEach(b=>b.classList.toggle('on',vsel.includes(+b.dataset.n)));$('#vd').textContent=d?'✓ وصل تصويتك':vsel.length?`صوّت (${vsel.length}/3) ✓`:'ما بدي أصوّت ✓';$('#vd').disabled=!!d;root.querySelectorAll('.vb').forEach(b=>{if(+b.dataset.n!==m.num)b.disabled=!!d})};
      root.querySelectorAll('.vb').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;if(vsel.includes(n))vsel=vsel.filter(x=>x!==n);else if(vsel.length<3)vsel.push(n);sync(false)});
      $('#vd').onclick=()=>sync(true);sync(!!m.d);return}
    if(k==='st_rev'){const r=m&&m.res;if(!r){root.innerHTML='<div class="p-center"><div class="em">🔎</div><p>شوف الشاشة…</p></div>';return}
      root.innerHTML=`<div class="p-center"><p>هالجولة</p><div class="okbig ${r[0]>=0?'g':'r'}">${N(sgn(r[0]))}</div>
        <p>${r[3]?`سرقت ${r[3]} ${r[3]>1?'أغراض':'غرض'} بـ${r[4]} نقاط`:'ما سرقت إشي'}${r[7]?` · مسكوك ${r[7]} 👀`:r[6]?' · ما حدا مسكك 😎 +1':''}</p><p>حزرت ${r[1]} صح${r[2]?` و${r[2]} غلط`:''}</p></div>`;return}
    if(k==='cam_watch'){root.innerHTML=`<div class="p-center"><div class="em">📹</div><h2>طّلع على الشاشة!</h2><p>ركّز: مين بياخذ إشي، مين بيختبي، ومين بيروح وين.</p></div>`;return}
    if(k.startsWith('cam_q')){const q=HS.q;qSent=null;root.innerHTML=`<div class="ph-top"><span class="stat">سؤال ${q.n} من 3</span><span class="stat t" id="tm"></span></div><h2 style="font-size:24px;font-weight:800;text-align:center;margin:6px 0">${esc(q.txt)}</h2>
        <div class="qbtns">${q.o.map((o,i)=>`<button class="qb" data-i="${i}">${q.kind==='look'?lookSvg(o)+esc(lookName(o)):esc(o)}</button>`).join('')}</div><p id="qs" style="text-align:center;color:var(--muted);margin:0"></p>`;
      root.querySelectorAll('.qb').forEach(b=>b.onclick=()=>{if(qSent!=null)return;qSent=+b.dataset.i;send({an:[nx(),q.id,qSent]});b.classList.add('on');root.querySelectorAll('.qb').forEach(x=>x.disabled=x!==b);$('#qs').textContent='✓ وصل جوابك'});return}
    if(k.startsWith('cam_ans')){root.innerHTML=`<div class="p-center">${m.ok?`<div class="okbig g">✓</div><h2>صح! ${N('+'+m.pts)}</h2>`:`<div class="okbig r">✗</div><h2>${m.a<0?'ما جاوبت':'غلط'}</h2>`}<p>الجواب: <b>${HS.q.kind==='look'?esc(lookName(HS.q.o[HS.q.ai])):esc(HS.q.o[HS.q.ai])}</b></p></div>`;return}
    if(k.startsWith('wh_play')){root.innerHTML=`<div class="ph-top"><span class="stat">🦘 <span class="dots" id="jd"></span></span><span class="stat t" id="tm"></span></div>
        <button class="bigact" id="jb"><span class="fill" id="jf"></span>🦘 نُطّ</button>
        <p style="margin:0;text-align:center;color:var(--muted)">شفت حالك؟ اكبس على غرفتك:</p><div class="mapwrap"><canvas class="pmap" id="rm"></canvas></div><div id="ws" style="text-align:center;font-weight:800;min-height:1.6em"></div>`;
      $('#jb').onclick=()=>send({jp:nx()});
      $('#rm').onpointerdown=e=>{const mm=me();if(!mm||mm.done||mm.frz>0||!MP)return;const r=e.currentTarget.getBoundingClientRect(),w=MP.inv(e.clientX-r.left,e.clientY-r.top);if(w[0]<0||w[1]<0||w[0]>HW||w[1]>HD)return;const rr=roomAt(w[0],w[1]);tapR={r:rr,t:Date.now()};send({ra:[nx(),rr]})};return}
    if(k==='wh_rev'){root.innerHTML=`<div class="p-center">${m.ok?`<div class="okbig g">✓</div><h2>لقيت حالك! ${N(sgn(m.rp))}</h2>`:`<div class="okbig r">✗</div><h2>ما لقيت حالك ${m.rp?N(sgn(m.rp)):''}</h2>`}<p>كنت ب<b>${ROOMS[m.room].n}</b>. شوف اسمك على الشاشة.</p></div>`;return}
    if(k==='bm'){root.innerHTML='<div id="bmv" style="display:flex;flex-direction:column;gap:12px;flex:1"></div>';bmKey='';return}
    if(k==='segres'){root.innerHTML=`<div class="p-center"><div class="em">${SEGS[HS.seg].e}</div><p>بفقرة ${SEGS[HS.seg].t} أخذت</p><div class="okbig ${m.sp>=0?'g':'r'}">${N(sgn(m.sp))}</div></div>`;return}
    if(k==='board'){root.innerHTML=`<div class="p-center"><div class="em">🏆</div><p>ترتيبك</p><div class="okbig g">${m.rk}</div><h2>${N(m.sc)} نقطة</h2></div>`;return}
    if(k==='final'){root.innerHTML='<div class="p-center" id="fv"></div>';finKey='';return}
    root.innerHTML='<div class="p-center"><div class="em">👀</div><p>طّلع على الشاشة…</p></div>'}

  let MP=null,tapR=null,bmKey='',finKey='';
  function update(k){const m=me();const tm=$('#tm');if(tm)tm.textContent=fmt(left());
    if(m&&m.ms&&m.ms[0]!==lastMs){if(lastMs!=null)toast(m.ms[1]);lastMs=m.ms[0]}
    if(k.startsWith('st_play')&&m){$('#sN').textContent=`💰 ${m.n}`;const o=m.nr>=0?OBJS[m.nr]:null;
      $('#nc').innerHTML=o?`<span class="e">${OBJE[o.id]}</span><div><b>${esc(o.n)}</b><span>جنبك هلأ${o.big?' · بدها وقت':''}</span></div><span class="v">${N('+'+o.pts)}</span>`:`<span class="e">🚶</span><div><b>ما في إشي جنبك</b><span>استنى لحد ما تقرّب من غرض</span></div>`;
      const sb=$('#sb');sb.disabled=!o||m.cd>0||!!m.stl;$('#sl').textContent=m.stl?'⏳ عم تسرق…':m.cd>0?`⏳ ${m.cd}`:'🫳 اسرق';$('#sf').style.width=(m.cd>0?(1-m.cd/10)*100:0)+'%'}
    if(k.startsWith('wh_play')&&m){$('#jd').textContent='●'.repeat(m.jl)+'○'.repeat(Math.max(0,(HS.r===1?3:2)-m.jl));const jb=$('#jb');jb.disabled=m.jl<1||m.jcd>0||!!m.done;$('#jf').style.width=(m.jcd>0?(1-m.jcd/2)*100:0)+'%';
      const ws=$('#ws');if(m.done){ws.innerHTML=`<span style="color:var(--mint)">✓ صح! ${N(sgn(m.rp))}</span>`}else if(m.frz>0){ws.innerHTML=`<span style="color:var(--danger)">✗ غلط −1 · استنى ${m.frz}</span>`}else ws.textContent=''}
    if(k==='bm'&&HS.bm)renderBomb(m);
    if(k==='final')renderFinal()}
  function renderBomb(m){const B=HS.bm,mine=B.h===pid&&!B.fl,out=B.out.includes(pid),v=$('#bmv');if(!v)return;
    if(mine&&lastHolder!==pid)buzz([120,60,120]);lastHolder=mine?pid:B.h;root.classList.toggle('hot',mine&&HS.ph==='bm_play');
    const ts=B.al.filter(id=>id!==pid&&(id!==B.f||B.al.length<=2));
    const kk=JSON.stringify([HS.ph,mine,out,B.h,B.fl,ts,B.lock]);
    if(kk!==bmKey){bmKey=kk;
      if(out){const place=B.out.indexOf(pid)+1,n=HS.pl.length;v.innerHTML=`<div class="p-center"><div class="em">💥</div><h2>طلعت!</h2><p>طلعت بالترتيب <b>${n-place+1}</b> من ${n}. تابع مين رح يضل للآخر.</p></div>`}
      else if(HS.ph==='bm_boom')v.innerHTML='<div class="p-center"><div class="em">💥</div><h2>بووووم!</h2><p>استعد للجولة الجاية…</p></div>';
      else if(mine){v.innerHTML=`<div style="text-align:center"><div class="em" style="font-size:64px">💣</div><h2 style="font-family:var(--display);font-size:40px">معك! ارميها!</h2></div><div class="holdbar"><i id="hb"></i></div>
          <div class="tlist">${ts.map(id=>`<button class="tb" data-p="${esc(id)}" ${B.lock?'disabled':''}>${lookSvg(plLk(id))}${plName(id)}</button>`).join('')}</div>`;
        v.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{send({th:[nx(),b.dataset.p]});v.querySelectorAll('.tb').forEach(x=>x.disabled=true)})}
      else v.innerHTML=`<div class="p-center"><div class="em">😬</div><p>القنبلة مع</p><h2>${B.fl?'… طايرة!':plName(B.h)}</h2><p>إذا إجتك، التلفون بيهتز وبيصير أحمر.</p></div>`}
    const hb=$('#hb');if(hb)hb.style.width=Math.min(100,B.hold/5*100)+'%'}
  function renderFinal(){const v=$('#fv');if(!v)return;const won=!!HS.rk;const kk=won?'w':'d';if(kk===finKey)return;finKey=kk;
    if(!won){v.innerHTML='<div class="em">🥁</div><h2>مين الفائز؟</h2><p>طّلع على الشاشة!</p>';return}
    const i=HS.rk.findIndex(r=>r[0]===pid);v.innerHTML=i===0?`<div class="em">🏆</div><h2>إنت الفائز!</h2><p>${N(HS.rk[0][1])} نقطة. ارقص! 💃</p>`:`<p>ترتيبك</p><div class="okbig g">${i+1}</div><h2>${N(i>=0?HS.rk[i][1]:0)} نقطة</h2><p>الفائز: <b>${plName(HS.rk[0][0])}</b> 🏆</p>`}

  function render(force){const k=key();if(k!==lastKey||(force&&k==='nohost')){lastKey=k;build(k)}update(k)}
  (function loop(){const k=lastKey;
    if(k.startsWith('st_play')){const m=me(),cv=$('#mp');if(m&&cv){const t=iso(cv);const[x,y]=t.P(m.x,m.z),r=7+Math.sin(performance.now()/180)*2;t.g.fillStyle=LOOKS[m.lk].c;t.g.strokeStyle='#fff';t.g.lineWidth=3;t.g.beginPath();t.g.arc(x,y-3,r,0,7);t.g.fill();t.g.stroke()}}
    if(k.startsWith('wh_play')){const cv=$('#rm'),m=me();if(cv){let hl=null;if(tapR&&Date.now()-tapR.t<900)hl={r:tapR.r,c:m&&m.done?'rgba(95,224,180,.6)':'rgba(255,90,110,.5)'};MP=iso(cv,hl)}}
    const tm=$('#tm');if(tm&&HS)tm.textContent=fmt(left());
    requestAnimationFrame(loop)})();
  render();
}

$('#asHost').onclick=asHost;$('#asPlayer').onclick=asPlayer;
if(store.get('an_role')==='player'||((location.hash||'').replace('#','').length===4&&!store.get('an_role')))asPlayer();
})();
</script>

</body>
