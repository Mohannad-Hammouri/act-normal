<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Act Normal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Lalezar&display=swap">
<style>
/* Layout: one full-screen night-time house for the TV; a thumb-first controller for phones. Committed single dark look. */
:root{
  --bg:#150e24; --bg2:#21173a; --bg3:#2e2250; --ink:#f7f1ff; --muted:#ab9fcb;
  --lamp:#ffb547; --lamp2:#ffd28a; --mint:#5fe0b4; --danger:#ff5a6e; --ice:#8fd8ff;
  --line:rgba(255,255,255,.12);
  --display:'Lalezar','Baloo Bhaijaan 2',system-ui,sans-serif;
  --body:'Baloo Bhaijaan 2',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
button:disabled{cursor:default;opacity:.45}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
.logo{font-family:var(--display);letter-spacing:.5px;line-height:1}
.logo b{color:var(--lamp);font-weight:400}

/* ---------- role page ---------- */
#roleRoot{position:fixed;inset:0;display:grid;place-items:center;overflow-y:auto;padding:24px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 120%,#3a2a66 0%,var(--bg) 60%)}
.role-box{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:620px;width:100%}
.role-box .logo{font-size:clamp(64px,14vw,120px)}
.role-sub{font-size:20px;color:var(--lamp2);font-weight:700;margin-top:-6px}
.role-txt{color:var(--muted);font-size:16px;line-height:1.7;max-width:46ch}
.crowd{width:min(420px,100%);height:auto}
.role-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.big-btn{background:var(--lamp);color:#2a1700;font-size:20px;font-weight:800;padding:14px 24px;border-radius:16px;min-width:200px;box-shadow:0 6px 0 #b8741d}
.big-btn.alt{background:var(--bg3);color:var(--ink);box-shadow:0 6px 0 #170f2b}
.big-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b8741d}
.role-err{background:rgba(255,90,110,.15);border:1px solid var(--danger);padding:10px 14px;border-radius:12px;font-size:15px}

/* ---------- host ---------- */
#hostRoot{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%,#2d2150 0%,#140d22 75%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#dark{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(6,4,16,.45),rgba(3,2,10,.85));opacity:0;transition:opacity .9s;pointer-events:none}
#dark.on{opacity:1}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rlab{position:absolute;transform:translate(-50%,-50%);font-size:clamp(11px,1.1vw,16px);font-weight:700;color:#2b1f45;background:rgba(255,255,255,.65);padding:0 10px;border-radius:99px;white-space:nowrap}
.nlab{position:absolute;transform:translate(-50%,-100%);font-size:clamp(13px,1.3vw,19px);font-weight:800;color:#fff;background:var(--bg3);border:2px solid var(--lamp);padding:0 10px;border-radius:10px;white-space:nowrap}
.nlab.dead{border-color:var(--danger);opacity:.8}
.gunlab{position:absolute;transform:translate(-50%,-100%);font-size:28px}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-left,0px)) 0;pointer-events:none}
.hud-l{font-size:clamp(18px,1.7vw,26px);font-weight:800;background:rgba(21,14,36,.75);padding:4px 16px;border-radius:14px}
.hud-l small{display:block;font-size:.6em;font-weight:600;color:var(--muted)}
.timer{font-family:var(--display);font-size:clamp(38px,4.2vw,64px);line-height:1;background:rgba(21,14,36,.75);padding:6px 18px 0;border-radius:16px;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.timer.hot{color:var(--danger)}
#board{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 20px;pointer-events:none}
.chip{background:rgba(21,14,36,.8);border:1px solid var(--line);padding:3px 12px;border-radius:99px;font-weight:700;font-size:clamp(14px,1.2vw,18px);font-variant-numeric:tabular-nums}
.chip b{color:var(--lamp);margin-inline-start:6px}
.chip.out{opacity:.4;text-decoration:line-through}
.board-note{width:100%;text-align:center;color:var(--muted);font-size:13px}
#banner{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:all .25s;pointer-events:none;
  font-family:var(--display);font-size:clamp(28px,3.6vw,56px);text-align:center;padding:10px 28px 4px;border-radius:20px;background:var(--bg2);border:3px solid var(--lamp);white-space:nowrap;max-width:94vw}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner.red{border-color:var(--danger)} #banner.ice{border-color:var(--ice);color:var(--ice)} #banner.dark{border-color:#555;background:#05030c}
#alarm{position:absolute;top:calc(84px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;font-weight:800;font-size:clamp(18px,1.8vw,28px);padding:4px 22px;border-radius:12px;animation:blink 1s infinite;white-space:nowrap}
#alarm.calm{background:var(--bg3);animation:none}
@keyframes blink{50%{opacity:.6}}
#count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#count .n{font-family:var(--display);font-size:min(30vw,260px);color:var(--lamp);text-shadow:0 8px 0 #000a;line-height:1}
#count .t{font-size:clamp(20px,2vw,32px);font-weight:800;text-align:center;background:rgba(21,14,36,.85);padding:6px 20px;border-radius:14px}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:24px;overflow:auto}
.card{background:rgba(26,18,46,.92);border:1px solid var(--line);border-radius:24px;padding:28px 32px;width:min(920px,100%);box-shadow:0 30px 80px #0008}
.lobby-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:28px}
@media (max-width:760px){.lobby-grid{grid-template-columns:1fr}}
.lobby-grid .logo{font-size:clamp(56px,7vw,96px)}
.howto{color:var(--muted);line-height:1.75;font-size:16px;margin:8px 0 0;padding-inline-start:20px}
.howto b{color:var(--ink)}
.join-hint{margin-top:14px;background:var(--bg3);border-radius:14px;padding:10px 14px;font-weight:700}
.code-row{margin-top:6px;font-size:18px}.code{font-family:var(--display);font-size:46px;color:var(--lamp);letter-spacing:6px;font-weight:400;vertical-align:middle;margin-inline-start:8px}
.sec-t{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.3px;margin:0 0 6px}
.plist{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;margin-bottom:18px}
.pl{background:var(--bg3);padding:4px 14px;border-radius:99px;font-weight:700;animation:pop .35s}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.empty{color:var(--muted);font-size:15px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{background:var(--bg3);padding:6px 14px;border-radius:10px;font-weight:700;font-size:15px}
.seg button.on{background:var(--lamp);color:#2a1700}
.seg-note{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.mbtn{background:var(--bg3);padding:6px 14px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
.mbtn.on{background:var(--mint);color:#062a1e}
.res-t{font-family:var(--display);font-size:clamp(34px,3.6vw,52px);margin-bottom:6px}
.res-sub{color:var(--muted);margin-bottom:14px}
table.res{width:100%;border-collapse:collapse;font-size:clamp(16px,1.4vw,21px);font-variant-numeric:tabular-nums}
table.res td,table.res th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start}
table.res th{color:var(--muted);font-size:.75em;font-weight:700}
.tag{font-size:.75em;padding:1px 10px;border-radius:99px;background:var(--bg3);margin-inline-start:6px;white-space:nowrap}
.tag.red{background:var(--danger);color:#fff}.tag.gold{background:var(--lamp);color:#2a1700}
.pos{color:var(--mint)}.neg{color:var(--danger)}
.res-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#resPanel{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));width:min(430px,40vw);max-height:calc(100% - 28px);overflow:auto;padding:22px 24px}
.podium{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.pod{display:flex;justify-content:space-between;background:var(--bg3);border-radius:14px;padding:8px 16px;font-size:clamp(18px,1.6vw,24px);font-weight:800}
.pod:first-child{background:var(--lamp);color:#2a1700;font-size:clamp(24px,2.2vw,32px)}
.corner-btn{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));inset-inline-end:max(14px,env(safe-area-inset-right,0px));background:rgba(21,14,36,.7);font-size:13px;padding:4px 10px;border-radius:8px;color:var(--muted)}

/* ---------- phone ---------- */
#phoneRoot{position:fixed;inset:0;overflow-y:auto;padding:calc(40px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,var(--bg2),var(--bg) 40%);display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto;-webkit-user-select:none;user-select:none}
.p-center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:20px 0}
.p-center h2{font-family:var(--display);font-size:40px;line-height:1.1}
.p-center p{color:var(--muted);margin:0;line-height:1.7;max-width:34ch}
.p-in{width:100%;font:inherit;font-size:22px;font-weight:700;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.ph-top{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.me-chip{display:flex;align-items:center;gap:6px;font-weight:800;background:var(--bg3);padding:3px 12px 3px 6px;border-radius:99px}
.me-chip i{width:20px;height:20px;border-radius:50%;background:var(--v);border:2px solid #fff;display:block}
.stat{font-weight:800;background:var(--bg3);padding:3px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
.stat.t{font-family:var(--display);font-size:22px;font-weight:400;padding:2px 12px 0}
.mission{background:var(--bg2);border:2px dashed var(--lamp);border-radius:14px;padding:8px 12px;font-weight:700;line-height:1.5}
.mission b{color:var(--lamp)}
.ph-event{border-radius:12px;padding:8px 12px;font-weight:800;text-align:center}
.ph-event.dark{background:#000;border:1px solid #444}.ph-event.red{background:var(--danger)}.ph-event.calm{background:var(--bg3)}
.mapwrap{position:relative;background:#120b20;border-radius:16px;border:1px solid var(--line)}
#pMap{width:100%;display:block;touch-action:none}
.map-hint{position:absolute;bottom:6px;inset-inline-start:10px;font-size:12px;color:var(--muted);pointer-events:none}
.near{min-height:1.6em;text-align:center;font-weight:700;color:var(--muted)}
.near b{color:var(--ink)} .near .hot{color:var(--lamp)}
.ph-btns{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}
.act,.shoot{position:relative;overflow:hidden;font-size:26px;font-weight:800;padding:26px 10px;border-radius:18px;background:var(--mint);color:#062a1e;box-shadow:0 6px 0 #2a9a74}
.shoot{background:var(--bg3);color:var(--ink);box-shadow:0 6px 0 #170f2b}
.act .pb{position:absolute;inset:auto 0 0 auto;height:6px;background:#062a1e;width:0}
.act:active:not(:disabled),.shoot:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.hideb{font-size:18px;font-weight:800;padding:12px;border-radius:14px;background:#3d2c66;color:var(--ink);box-shadow:0 4px 0 #170f2b}
.hidov{position:fixed;inset:0;background:rgba(18,10,34,.94);display:grid;place-items:center;z-index:28;padding:24px}
.hidov div{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.hidov h2{font-family:var(--display);font-size:44px}.hidov p{color:var(--muted);margin:0;max-width:30ch}
.hidov button{font-size:24px;font-weight:800;background:var(--lamp);color:#2a1700;padding:16px 40px;border-radius:18px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--mint);color:#062a1e;font-weight:800;padding:8px 18px;border-radius:12px;z-index:20;animation:pop .3s;white-space:nowrap}
.freeze{position:fixed;inset:0;background:rgba(10,30,50,.88);display:grid;place-items:center;z-index:30;padding:24px}
.freeze div{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.freeze h2{font-family:var(--display);font-size:46px;color:var(--ice)}
.freeze button{font-size:30px;font-weight:800;background:var(--ice);color:#06263a;padding:22px 40px;border-radius:22px}
.sheet{position:fixed;inset:0;background:rgba(10,6,20,.94);z-index:25;display:flex;flex-direction:column;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-weight:800;font-size:20px;text-align:center}
.sheet p{margin:0;color:var(--muted);text-align:center;font-size:14px}
#pRoom{width:100%;max-width:560px;margin:0 auto;display:block;background:#120b20;border-radius:16px;touch-action:none}
.sheet-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;width:100%;margin:0 auto}
.fire{background:var(--danger);color:#fff;font-size:22px;font-weight:800;padding:16px;border-radius:16px}
.cancel{background:var(--bg3);font-size:18px;font-weight:700;padding:16px;border-radius:16px}
.exit{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));inset-inline-end:max(8px,env(safe-area-inset-right,0px));background:transparent;color:var(--muted);font-size:20px;padding:4px 10px;z-index:5}
.swatch{width:96px;height:96px}
.rank{font-family:var(--display);font-size:72px;color:var(--lamp);line-height:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="roleRoot">
  <div class="role-box">
    <svg class="crowd" viewBox="0 0 420 120" aria-hidden="true" id="crowdSvg"></svg>
    <h1 class="logo">Act <b>Normal</b></h1>
    <div class="role-sub">تصرّف طبيعي… وإنت بتسرق</div>
    <p class="role-txt">كلكم بتمثّلوا إنكم ناس عاديين بين زحمة شخصيات. كل جولة لازم تسرق قبل ما حدا يكشفك ويطخّك. افتح نفس الرابط على الشاشة الكبيرة وعلى تلفون كل لاعب.</p>
    <div class="role-btns">
      <button class="big-btn" id="asHost">📺 الشاشة الكبيرة</button>
      <button class="big-btn alt" id="asPlayer">📱 تلفون (لاعب)</button>
    </div>
    <div id="roleMsg"></div>
  </div>
</div>

<div id="hostRoot" hidden>
  <canvas id="gl"></canvas>
  <div id="dark"></div>
  <div id="labels"></div>
  <div id="hud" hidden>
    <div class="hud-l" id="hudL"></div>
    <div class="timer" id="hudT">1:30</div>
  </div>
  <div id="alarm" hidden></div>
  <div id="board" hidden></div>
  <div id="banner"></div>
  <div id="count" hidden></div>
  <div id="lobby" class="ov" hidden></div>
  <div id="resPanel" class="card" hidden></div>
  <div id="overOv" class="ov" hidden></div>
  <button class="corner-btn" id="endRoundBtn" hidden>إنهاء الجولة</button>
</div>

<div id="phoneRoot" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
document.documentElement.dir='rtl';document.documentElement.lang='ar';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const N=n=>`<bdi dir="ltr">${n}</bdi>`;
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* =================== world =================== */
const RW=9,RD=8,HW=27,HD=16,SPEED=1.7,NEAR=2.4;
const VAR=[{n:'الأحمر',a:'🧢 أبو الكاب',c:'#ff6b6b',d:'#c92a2a'},{n:'الأزرق',a:'🧶 أبو الطاقية الصوف',c:'#4dabf7',d:'#1864ab'},{n:'الأصفر',a:'🍩 أبو الشعر المكعكع',c:'#ffd43b',d:'#d9480f'},{n:'الأخضر',a:'👓 أبو النظارة',c:'#69db7c',d:'#2b8a3e'},{n:'البنفسجي',a:'🎀 أبو الفيونكة',c:'#b197fc',d:'#5f3dc4'}];
const ROOMS=[['المطبخ','#f0c987'],['الصالون','#a9dcb9'],['المكتبة','#c3b2ea'],['غرفة النوم','#f3b6c6'],['المعرض','#e6d9b0'],['الخزنة','#a9bfd6']]
  .map(([n,f],i)=>({i,n,f,x0:(i%3)*RW,z0:Math.floor(i/3)*RD}));
const roomAt=(x,z)=>Math.min(1,Math.max(0,Math.floor(z/RD)))*3+Math.min(2,Math.max(0,Math.floor(x/RW)));
const DOORS=[];
for(let r=0;r<2;r++)for(let c=0;c<2;c++)DOORS.push({a:r*3+c,b:r*3+c+1,x:(c+1)*RW,z:r*RD+RD/2,ax:'z'});
for(let c=0;c<3;c++)DOORS.push({a:c,b:3+c,x:c*RW+RW/2,z:RD,ax:'x'});
const ADJ=ROOMS.map(()=>[]);DOORS.forEach(d=>{ADJ[d.a].push(d.b);ADJ[d.b].push(d.a)});
const doorOf=(a,b)=>DOORS.find(d=>(d.a===a&&d.b===b)||(d.a===b&&d.b===a));
// walls: [x1,z1,x2,z2,h]
const WALLS=[];
function wallRun(axis,fixed,from,to,gaps,h){let s=from;const gs=gaps.slice().sort((a,b)=>a-b);
  gs.forEach(g=>{const e=g-1.1;if(e>s)push(s,e);s=g+1.1});if(to>s)push(s,to);
  function push(a,b){WALLS.push(axis==='x'?[a,fixed,b,fixed,h]:[fixed,a,fixed,b,h])}}
wallRun('x',0,0,HW,[],1.9);wallRun('z',0,0,HD,[],1.9);
wallRun('z',9,0,HD,[4,12],.55);wallRun('z',18,0,HD,[4,12],.55);wallRun('x',8,0,HW,[4.5,13.5,22.5],.55);
wallRun('x',HD,0,HW,[],.22);wallRun('z',HW,0,HD,[],.22);

    const near=$('#pNear');if(m.nr>=0){const o=OBJS[m.nr];near.innerHTML=m.nr===m.m?`جنبك: <b class="hot">${esc(o.n)}</b> ← هاي مهمتك!`:`جنبك: <b>${esc(o.n)}</b> (تفاعل عادي للتمويه)`}else near.textContent='ما في إشي جنبك تتفاعل معه';
    const act=$('#bAct'),pb=$('#pb');act.disabled=!(m.nr>=0)||m.ia>=0;pb.style.width=(m.ia>=0?m.ia*100:0)+'%';act.firstChild.textContent=m.ia>=0?'⏳ عم تتفاعل… ':'✋ تفاعل';
    $('#bShoot').disabled=m.b<1||HS.ev==='blackout';
    const fz=$('#frz');fz.hidden=HS.ev!=='freeze';if(HS.ev==='freeze'){$('#bStop').hidden=!m.wk;$('#frzP').textContent=m.wk?'إنت ماشي! وقّف بسرعة قبل ما ينتبهوا':'إنت واقف ✓ لا تتحرك'}
    if(sheetOpen&&(m.b<1||HS.ev==='blackout')){sheetOpen=false;$('#sheet').hidden=true}
    if(lastSn!=null&&m.sn>lastSn)toast('✅ سرقتها! إلك مهمة جديدة');lastSn=m.sn;
    if(m.ms&&m.ms[0]!==lastMs){if(lastMs!=null)toast(m.ms[1]);lastMs=m.ms[0]}else if(!m.ms&&lastMs==null)lastMs=0;
    const hb=$('#bHide'),ho=$('#hidOv'),hidden=m.hi>=0;ho.hidden=!hidden;
    if(hidden){$('#hidP').textContent='إنت مختبي '+HIDES[m.hi].hide+'. لما يخلص الوقت بتطلع لحالك.';$('#hidN').textContent=m.hd}
    hb.hidden=hidden||m.nh<0;if(m.nh>=0){hb.disabled=m.hc>0;hb.textContent=m.hc>0?`🫣 بتقدر تختبي بعد ${m.hc} ث`:`🫣 اختبي ${HIDES[m.nh].hide} (أو فتّش)`}
    if(hidden){act.disabled=true;$('#bShoot').disabled=true}
    if(dest&&Math.hypot(dest[0]-m.x,dest[1]-m.z)<.5)dest=null}
  let toastT=null;function toast(t){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200)}

  function render(){const k=phaseKey();if(k!==lastKey||k==='nohost'){lastKey=k;sheetOpen=false;dest=null;build(k)}update(k)}

  /* ---------- map drawing (iso, same angle as the TV) ---------- */
  const IX=.7071,IY=.4082;let MT=null;
  function setupCanvas(cv,minX,maxX,maxY){const w=cv.clientWidth||320,dpr=Math.min(2,devicePixelRatio||1),pad=12,s=(w-pad*2)/(maxX-minX),h=Math.round(maxY*s+pad*2);
    if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.height=h+'px'}
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);return{g,s,pad,minX,w,h}}
  function drawHouse(){const cv=$('#pMap');if(!cv)return;const m=meS();if(!m)return;
    const T=setupCanvas(cv,-HD*IX,HW*IX,(HW+HD)*IY);MT=T;const{g,s,pad}=T;const P=(x,z)=>[pad+((x-z)*IX+HD*IX)*s,pad+(x+z)*IY*s];
    const poly=(pts,fill)=>{g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=fill;g.fill()};
    ROOMS.forEach(R=>poly([P(R.x0,R.z0),P(R.x0+RW,R.z0),P(R.x0+RW,R.z0+RD),P(R.x0,R.z0+RD)],R.f));
    g.lineCap='round';WALLS.forEach(([x1,z1,x2,z2,h])=>{g.strokeStyle=h>1?'#3a2a5e':'#6b5a8e';g.lineWidth=h>1?4:2.5;g.beginPath();g.moveTo(...P(x1,z1));g.lineTo(...P(x2,z2));g.stroke()});
    g.font='600 11px "Baloo Bhaijaan 2",sans-serif';g.textAlign='center';g.fillStyle='rgba(43,31,69,.75)';ROOMS.forEach(R=>{const[x,y]=P(R.x0+RW/2,R.z0+RD/2);g.fillText(R.n,x,y+4)});
    const t=performance.now();
    const gone=new Set(HS.gone||[]);OBJS.forEach(o=>{if(gone.has(o.id))return;const[x,y]=P(o.x,o.z);if(o.id===m.m){g.fillStyle='#ffb547';star(g,x,y,9+Math.sin(t/200)*1.5);g.strokeStyle='#2a1700';g.lineWidth=1.5;g.stroke()}else{g.fillStyle='rgba(43,31,69,.45)';g.beginPath();g.arc(x,y,3,0,7);g.fill()}});
    HIDES.forEach(h=>{const[x,y]=P(h.x+(h.ext[0]+h.ext[1])/2,h.z+(h.ext[2]+h.ext[3])/2);g.font='12px sans-serif';g.textAlign='center';g.fillText('🫣',x,y+4)});
    if(dest){const[x,y]=P(dest[0],dest[1]);g.strokeStyle='#fff';g.lineWidth=2;g.setLineDash([3,3]);g.beginPath();g.ellipse(x,y,8,5,0,0,7);g.stroke();g.setLineDash([])}
    const[x,y]=P(m.x,m.z);g.fillStyle=VAR[m.v].c;g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(x,y-3,7,0,7);g.fill();g.stroke();
    g.fillStyle='#fff';g.font='800 11px "Baloo Bhaijaan 2",sans-serif';g.fillText('إنت',x,y-14)}
  function star(g,x,y,r){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath();g.fill()}
  function fromMap(px,py){if(!MT)return null;const{s,pad}=MT;const a=((px-pad)/s-HD*IX)/IX,b=((py-pad)/s)/IY;return[(a+b)/2,(b-a)/2]}
  let RT=null;
  function drawRoom(){const cv=$('#pRoom');if(!cv||!sheetOpen)return;const m=meS();if(!m)return;const R=ROOMS[roomAt(m.x,m.z)];
    const T=setupCanvas(cv,-RD*IX,RW*IX,(RW+RD)*IY+.9);const{g,s,pad}=T;const top=.9*s;
    const P=(x,z)=>[pad+(((x-R.x0)-(z-R.z0))*IX+RD*IX)*s,pad+top+((x-R.x0)+(z-R.z0))*IY*s];RT={P,list:[]};
    g.beginPath();[P(R.x0,R.z0),P(R.x0+RW,R.z0),P(R.x0+RW,R.z0+RD),P(R.x0,R.z0+RD)].forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=R.f;g.fill();
    [...OBJS,...DEC.filter(d=>d.col)].filter(o=>o.room===R.i).forEach(o=>{const[x,y]=P(o.x+(o.ext[0]+o.ext[1])/2,o.z+(o.ext[2]+o.ext[3])/2);g.fillStyle='rgba(43,31,69,.22)';g.beginPath();g.ellipse(x,y,Math.max(.3,(o.ext[1]-o.ext[0]+o.ext[3]-o.ext[2])*.35)*s,Math.max(.2,(o.ext[1]-o.ext[0]+o.ext[3]-o.ext[2])*.2)*s,0,0,7);g.fill()});
    HIDES.filter(h=>h.room===R.i).forEach(h=>{const cx=h.x+(h.ext[0]+h.ext[1])/2,cz=h.z+(h.ext[2]+h.ext[3])/2;const[px,py]=P(cx,cz);const id=-100-h.hi;RT.list.push({id,px,py});
      g.fillStyle=id===sel?'#ff3b55':'rgba(43,31,69,.75)';g.beginPath();g.roundRect?g.roundRect(px-34,py-12,68,22,8):g.rect(px-34,py-12,68,22);g.fill();
      g.fillStyle='#fff';g.font='700 11px "Baloo Bhaijaan 2",sans-serif';g.textAlign='center';g.fillText('🫣 '+h.hide,px,py+3)});
    const oc=(m.oc||[]).slice().sort((a,b)=>(a[2]+a[3])-(b[2]+b[3]));const u=s*.42;
    oc.forEach(([id,v,x,z])=>{const[px,py]=P(x,z),me=id===m.c;RT.list.push({id,px,py:py-u*1.4,me});
      g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(px,py,u*.9,u*.4,0,0,7);g.fill();
      g.fillStyle=VAR[v].c;g.beginPath();g.ellipse(px,py-u*1.1,u*.85,u,0,0,7);g.fill();
      g.fillStyle='#ffd9b3';g.beginPath();g.arc(px,py-u*2.5,u*.75,0,7);g.fill();g.fillStyle=VAR[v].d;g.beginPath();g.arc(px,py-u*2.6,u*.77,Math.PI,0);g.fill();
      if(id===sel){g.strokeStyle='#ff3b55';g.lineWidth=4;g.beginPath();g.ellipse(px,py-u*1.5,u*1.6,u*2.4,0,0,7);g.stroke()}
      if(me){g.fillStyle='#fff';g.font='800 13px "Baloo Bhaijaan 2",sans-serif';g.textAlign='center';g.fillText('إنت',px,py-u*3.6)}});
    if(oc.length<=1){g.fillStyle='rgba(43,31,69,.7)';g.font='700 14px "Baloo Bhaijaan 2",sans-serif';g.textAlign='center';g.fillText('ما في حدا معك بالغرفة',T.w/2,T.h/2)}}
  function pickTarget(px,py){if(!RT)return;let best=null,bd=40;RT.list.forEach(c=>{if(c.me)return;const d=Math.hypot(c.px-px,c.py-py);if(d<bd){bd=d;best=c}});sel=best?best.id:null;$('#bFire').disabled=sel==null}
  (function loop(){if(lastKey==='play'){drawHouse();drawRoom();const tEl=$('#pTime');if(tEl&&HS){tEl.textContent=fmt(Math.max(0,HS.left-(Date.now()-hsAt)/1000))}}requestAnimationFrame(loop)})();
  render();
}
